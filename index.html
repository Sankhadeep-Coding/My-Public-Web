<!DOCTYPE html>
<html>
<head>
    <title>My Dream Pet</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="pet-card">
        <h1>My Dream Pet</h1>

        <img class="pet-image"
             src="Golden.jpg"
	     alt="Cute Dog">

	<h2>My Pet's Name: Bruno</h2>
	
	<p>
	   Bruno is my dream pet. He is friendly, playful and loves to run in the park!
        </p>

	<div class="fact-box">
	   <h3>Fun Facts</h3>
	   <p> Bruno loves playing with balls.</p>
	   <p>Bruno loves tasty food.</p>
	   <p>Bruno loves his family.</p>
	   
	 </div>
	 <button onclick="ShowLove()">Show My Love</button>
	 <button onclick="FeedPet()">Feed My Pet</button>

	 <p id="message">Bruno is waiting for you!</p>
	 <p id="foodCount">Food Given: 0</p>
       </div>

       <script src="script1.js"></script>
</body>
</html>
